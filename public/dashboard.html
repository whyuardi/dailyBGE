<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard — Benua Green Energy Daily Report">
  <title>Dashboard — BGE</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>

    <main class="main">
      <div class="page-head">
        <div class="page-title">Dashboard</div>
        <div class="page-desc" id="dashDate"></div>
      </div>

      <div class="stats" id="statsGrid"></div>

      <div class="filters">
        <input type="date" id="filterDate" class="field-input">
        <select id="filterDivision" class="field-select">
          <option value="">Semua Divisi</option>
        </select>
      </div>

      <div id="missingSection" style="display:none;margin-bottom:16px;">
        <div class="card">
          <div class="card-head">
            <span class="card-title">Belum submit</span>
            <span class="badge badge-red" id="missingCount">0</span>
          </div>
          <div class="card-body" id="missingList"></div>
        </div>
      </div>

      <div id="reportsList"></div>
    </main>

    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
