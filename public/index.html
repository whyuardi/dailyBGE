<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login — Benua Green Energy Daily Report">
  <title>Login — BGE Daily Report</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-header">
        <div class="login-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <h1>Benua Green Energy</h1>
        <p>Masuk ke Daily Report</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label class="field-label" for="phone">Nomor HP</label>
          <input type="tel" id="phone" class="field-input" placeholder="08123456789" autocomplete="tel" required>
        </div>

        <div class="field">
          <label class="field-label" for="pin">PIN</label>
          <input type="password" id="pin" class="field-input" placeholder="4 digit" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="margin-top: 8px;">
          Masuk
        </button>
      </form>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
