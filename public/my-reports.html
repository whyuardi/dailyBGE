<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Riwayat Report — Benua Green Energy">
  <title>Riwayat — BGE</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>

    <main class="main">
      <div class="page-head">
        <div class="page-title">Riwayat</div>
        <div class="page-desc">Report yang sudah disubmit</div>
      </div>

      <div class="filters">
        <input type="date" id="filterFrom" class="field-input" title="Dari tanggal">
        <input type="date" id="filterTo" class="field-input" title="Sampai tanggal">
        <button class="btn btn-secondary btn-sm" onclick="loadReports()">Filter</button>
      </div>

      <div id="reportsList"></div>
    </main>

    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/my-reports.js"></script>
</body>
</html>
